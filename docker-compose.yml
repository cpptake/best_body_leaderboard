version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: bodybuilder-db
    environment:
      POSTGRES_USER: bodybuilder
      POSTGRES_PASSWORD: password
      POSTGRES_DB: bodybuilder_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bodybuilder"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: bodybuilder-backend
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=development
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - CORS_ORIGINS=http://localhost:3000
      - PORT=5000
      - DATABASE_URL=postgresql://bodybuilder:password@db:5432/bodybuilder_db
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET}
      - AWS_REGION=${AWS_REGION:-ap-northeast-1}
      - S3_BASELINE_IMAGE_KEY=${S3_BASELINE_IMAGE_KEY:-baseline/baseline.jpg}
    volumes:
      - ./backend:/app
      - ./frontend/public:/app/frontend_public:ro
      - /app/__pycache__
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: bodybuilder-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5000
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
